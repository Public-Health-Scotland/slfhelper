# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install pak
        run: Rscript -e 'install.packages("pak")'

      - name: Install GitHub packages
        run: Rscript -e 'pak::pkg_install(c("Public-Health-Scotland/source-linkage-files","Public-Health-Scotland/phsmethods"))'


      - name: Install CRAN packages
        run: Rscript -e 'install.packages(c("lintr"))'

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: false
