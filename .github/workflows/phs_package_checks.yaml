on:
  push:
    branches: [production, main, master]
  pull_request:
  workflow_dispatch:

name: phs_checks.yaml

jobs:
  PHS-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2

      - name: Install createslf manually
        run: Rscript -e 'pak::pkg_install("Public-Health-Scotland/source-linkage-files")'

      - uses: Public-Health-Scotland/actions/.github/workflows/phs_package_checks.yaml@v1.6.0
        permissions: write-all
        secrets: inherit
